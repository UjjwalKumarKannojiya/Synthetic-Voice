<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceGuard Forensics</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">V</span><span>VoiceGuard<br><small>Forensics</small></span></div>
    <nav id="nav" aria-label="Primary navigation"></nav>
    <p class="sidebar-note">Research prototype<br>Additional verification signal only.</p>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><p class="kicker">Synthetic voice screening</p><h1 id="page-title">Dashboard</h1></div>
      <div class="header-tools">
        <label class="profile-control">Upload model
          <select id="model-profile" aria-label="Model profile">
            <option value="legacy_for2sec">FoR 2-second windows</option>
            <option value="asvspoof_la_balanced2500">ASVspoof complete clips</option>
          </select>
        </label>
        <span class="model-pill" id="model-status" role="status">Checking model…</span>
      </div>
    </header>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="content"></section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
